<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA Academic Resources Hub - Class 1K</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.2);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #93c5fd;
            font-size: 1rem;
            font-weight: 500;
        }

        .container {
            max-width: 1100px;
            margin: -20px auto 0;
            padding: 0 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid var(--border);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #eff6ff;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .stat-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .controls-card {
            background: var(--surface);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 0.85rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .section-divider {
            margin: 2.5rem 0 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-divider h2 {
            font-size: 1.3rem;
            color: var(--primary);
            white-space: nowrap;
        }

        .section-divider .line {
            height: 2px;
            background: var(--border);
            width: 100%;
            border-radius: 2px;
        }

        .course-card {
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card-bg-blue { background-color: #f0f7ff; border-left: 6px solid #2563eb; }
        .card-bg-green { background-color: #f0fdf4; border-left: 6px solid #16a34a; }
        .card-bg-purple { background-color: #faf5ff; border-left: 6px solid #9333ea; }
        .card-bg-rose { background-color: #fff1f2; border-left: 6px solid #e11d48; }
        .card-bg-amber { background-color: #fffbeb; border-left: 6px solid #d97706; }
        .card-bg-teal { background-color: #f0fdfa; border-left: 6px solid #0d9488; }
        .card-bg-indigo { background-color: #eef2ff; border-left: 6px solid #4f46e5; }

        .course-header {
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .course-header:hover {
            background: rgba(255, 255, 255, 1);
        }

        .course-title-group h2 {
            font-size: 1.15rem;
            color: var(--primary);
            font-weight: 600;
        }

        .course-title-group p {
            font-size: 0
